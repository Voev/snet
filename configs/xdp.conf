xdp {

    # Two endpoints, paired in order: eth0 <-> eth1.
    # Both use queue 0.
    input = veth-p0:0,veth-p1:0

    # UMEM
    # num_frames must be >= fill_size + rx_size.
    num_frames      = 8192
    frame_size      = 2048
    frame_headroom  = 0

    # Rings
    fill_size = 4096
    comp_size = 4096
    rx_size   = 2048
    tx_size   = 2048

    # Batching
    batch_size = 64

    # Mode
    # zero_copy=true  -> XDP_FLAGS_DRV_MODE  (native, real NIC)
    # zero_copy=false -> XDP_FLAGS_SKB_MODE  (generic, veth/VBox)
    zero_copy   = false
    need_wakeup = true
}
